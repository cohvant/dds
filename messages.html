let filteredMsgs = messages;
let currentMsg = null;

function renderMessages() {
const list = document.getElementById('messageList');
list.innerHTML = filteredMsgs.map((msg, idx) => `
<div class="message-item" onclick="selectMessage(${messages.indexOf(msg)})">
<div class="message-title"><i class="bi bi-chat-dots"></i> ${msg.title}</div>
<div class="message-preview"><strong>${msg.category}:</strong> ${msg.preview}</div>
</div>
`).join('');
}

function filterMessages() {
const search = document.getElementById('searchInput').value.toLowerCase();
const cat = document.getElementById('categoryFilter').value;
filteredMsgs = messages.filter(m => {
const matchSearch = m.title.toLowerCase().includes(search) || 
m.preview.toLowerCase().includes(search) || 
m.category.toLowerCase().includes(search);
const matchCat = !cat || m.category === cat;
return matchSearch && matchCat;
});
renderMessages();
}

function selectMessage(idx) {
currentMsg = messages[idx];
document.getElementById('modalTitle').textContent = currentMsg.title;
const form = document.getElementById('formFields');
form.innerHTML = currentMsg.fields.map(f => `
<div class="form-group">
<label>${fieldLabels[f] || f}:</label>
<input type="text" id="field_${f}" oninput="updatePreview()">
</div>
`).join('');
document.getElementById('messagePreview').textContent = '';
document.getElementById('successMsg').style.display = 'none';
document.getElementById('customizeModal').style.display = 'block';
}

function updatePreview() {
if (!currentMsg) return;
const data = {};
currentMsg.fields.forEach(f => {
data[f] = document.getElementById(`field_${f}`).value || `[${fieldLabels[f] || f}]`;
});
document.getElementById('messagePreview').textContent = currentMsg.template(data);
}

function copyToClipboard() {
const data = {};
let allFilled = true;
currentMsg.fields.forEach(f => {
const val = document.getElementById(`field_${f}`).value.trim();
if (!val) allFilled = false;
data[f] = val;
});
if (!allFilled) {
alert('Please fill in all fields before copying!');
return;
}
const txt = currentMsg.template(data);
navigator.clipboard.writeText(txt).then(() => {
document.getElementById('successMsg').style.display = 'block';
setTimeout(() => {
document.getElementById('successMsg').style.display = 'none';
}, 3000);
});
}

function closeModal() {
document.getElementById('customizeModal').style.display = 'none';
currentMsg = null;
}

document.getElementById('searchInput').addEventListener('input', filterMessages);
document.getElementById('categoryFilter').addEventListener('change', filterMessages);
window.onclick = e => {
if (e.target.id === 'customizeModal') closeModal();
};

renderMessages();
</script>
</body>
</html>
